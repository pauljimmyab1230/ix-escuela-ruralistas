# ============================================================================
# Reglas de categorización de respuestas abiertas
# IX Escuela de Jóvenes Ruralistas
# ----------------------------------------------------------------------------
# Convención de patrones (se aplican sobre texto en minúsculas sin acentos):
#   palabra          -> coincide como palabra completa  ->  \bpalabra\b
#   prefijo*         -> coincide como prefijo de palabra ->  \bprefijo\w*
#   frase compuesta  -> coincide como frase completa     ->  \bfrase\s+compuesta\b
#
# El orden de las reglas importa: en `modo: unica` gana la PRIMERA coincidencia.
# En `modo: multiple` se acumulan todas las coincidencias.
# ============================================================================

# ----------------------------------------------------------------------------
# Respuestas genéricas que no aportan contenido analizable.
# Se usan para descartar antes de categorizar.
# ----------------------------------------------------------------------------
no_validas:
  encuestas:
    - "-"
    - ""
    - "mucho"
    - "poco"
    - "regular"
    - "nada"
    - "ninguno"
    - "ninguna"
    - "ningun"
    - "sin respuesta"
    - "sin comentarios"
    - "ns"
    - "si"
    - "no"
  linea_base:
    - "-"
    - ""
    - "."
    - "ninguno"
    - "ninguna"
    - "nada"
    - "todo"
    - "todo lo que se pueda"
    - "mucho"
    - "si"
    - "no"
    - "ns"
    - "sin respuesta"
    - "sin comentarios"
    - "aprender"
    - "conocimiento"
    - "mas conocimiento"
    - "ampliar mis conocimientos"
    - "aprender bastante"
    - "todo los temas"
    - "oportunidades"
    - "innovacion"
    - "investigacion"
    - "sostenibilidad"
    - "agroecologia"
    - "emprendimiento"
    - "economia circular"
    - "agroinnovacion"
    - "agricola"
    - "emprendimientos"

# Etiqueta asignada cuando la respuesta no es válida.
sin_respuesta: "Sin respuesta"

