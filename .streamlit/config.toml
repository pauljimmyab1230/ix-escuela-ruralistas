[theme]
base = "dark"
primaryColor = "#4CAF50"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e0e0e0"
font = "sans serif"

[server]
headless = true
port = 8501
enableCORS = false
# Protección CSRF activada: es la configuración segura por defecto.
enableXsrfProtection = true

[browser]
gatherUsageStats = false
